name: Update vendor submodules

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Fork-only: bump submodule pointers and push straight to main.
# No pull requests — avoids the Actions "create PRs" permission gate.
permissions:
  contents: write

concurrency:
  group: update-submodules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@94443046755490772719277d337a77e8a385f001 # v5.1.0
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update submodules to latest tracked branch
        run: |
          git submodule sync --recursive
          git submodule update --remote --recursive

      - name: Commit and push to main
        run: |
          set -euo pipefail
          git add -A -- vendor/ v2/crates/ruv-neural v2/crates/ruview-swarm v2/crates/worldgraph
          if git diff --cached --quiet; then
            echo "No submodule pointer changes."
            exit 0
          fi
          echo "### Submodule pointer changes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --submodule=log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git commit -m "chore: update vendor submodules to latest upstream"
          git push origin HEAD:${{ github.ref_name }}
